<!doctype html>
<meta charset="utf-8"><title>Home win — variants</title>
<style>
:root{--bg:#f5f5f5;--panel:#fff;--text:#151515;--dim:#626c80;--border:#d6d9de;
 --navy:#013369;--accent:#1b48e0;--red:#d50a0a;--green:#1a7f37;
 --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px}
.card{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:24px}
h1{font:800 italic 24px/1 system-ui;text-transform:uppercase;letter-spacing:-.02em;margin:0 0 6px}
h3{font:800 italic 15px/1 system-ui;text-transform:uppercase;letter-spacing:-.01em;margin:0 0 4px}
.sub{color:var(--dim);font-size:12px;margin:0 0 14px;max-width:78ch}
.eyebrow{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:12px}
img.t{object-fit:contain;vertical-align:middle}
.row{display:grid;grid-template-columns:210px 96px 210px;gap:14px;align-items:center;padding:9px 0;border-top:1px solid var(--border)}
.row:first-of-type{border-top:0}
.mu{display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.mu .at{color:var(--dim);font-size:11px}
.dot{width:7px;height:7px;border-radius:2px;flex:none}
.line{font-variant-numeric:tabular-nums;font-size:13px}
.line .ou{color:var(--dim);font-size:11px;margin-left:5px}
.cell{display:flex;align-items:center;gap:8px}
.val{font-variant-numeric:tabular-nums;font-size:13px;min-width:36px;text-align:right}
.track{flex:1;height:12px;background:#eceff3;border-radius:3px;position:relative;overflow:hidden}
.tall{height:16px}
.band{position:absolute;top:0;bottom:0;border-radius:2px}
.tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--navy)}
.mid{position:absolute;top:0;bottom:0;left:50%;width:1px;background:#c2c8d2}
.cap{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
.split{color:var(--red);font-weight:700}
.lg{display:flex;align-items:center;gap:6px}
</style>
<div class="wrap">
<h1>Home win — four ways</h1>
<p class="sub">Real Week 1 data. Across these games the three sources differ by 3.7 points on average and 7.8 at the widest, so the spread of opinion is real — it is just rendered grey-on-grey today.</p>
<div class="card" id="cards"></div>
</div>

const PC={'Nate Robinson':'#6b2fb3','Logan Borgelt':'#d50a0a','Eric Whitley':'#1b48e0','Mitch Fischer':'#e8842b','Evan Goguillon-Bader':'#f5d90a'};
const OWNER={}; D.players.forEach(p=>p.teams.forEach(t=>OWNER[t]=p.name));
const logo=c=>`https://a.espncdn.com/i/teamlogos/nfl/500/${c.toLowerCase()}.png`;
const img=(c,s=20)=>`<img class="t" src="${logo(c)}" width="${s}" height="${s}" alt="${c}">`;
const pct=v=>Math.round(v*100)+'%';
const games=D.games.filter(g=>g.p_book!=null).slice(0,8);
function stats(g){
  const v=[g.p_model,g.p_book,g.p_kalshi].filter(x=>x!=null);
  return {lo:Math.min(...v),hi:Math.max(...v),p:g.p_used};
}
function mu(g){
  const s=g.spread, homeFav=s!=null&&s<0;
  const side=(c,fav)=>`<span style="${fav?'font-weight:800':'color:var(--dim)'}"><span class="dot" style="background:${OWNER[c]?PC[OWNER[c]]:'transparent'};display:inline-block;margin-right:4px"></span>${img(c,20)} ${c}</span>`;
  return `<div class="mu">${side(g.away,!homeFav)}<span class="at">@</span>${side(g.home,homeFav)}</div>`;
}
function line(g){
  const s=g.spread, t=s==null?'—':s===0?'PK':s<0?`${g.home} ${s}`:`${g.away} ${-s}`;
  return `<div class="line">${t}<span class="ou">o/u ${g.total??'—'}</span></div>`;
}
// A — today
function A(g){const{lo,hi,p}=stats(g);
 return `<div class="cell"><span class="track">
   <i class="band" style="left:${lo*100}%;width:${Math.max(1.2,(hi-lo)*100)}%;background:#dfe4ea"></i>
   <i class="tick" style="left:calc(${p*100}% - 1px)"></i></span><span class="val">${pct(p)}</span></div>`;}

// D — logo-anchored, matching the swing column

   </span>${img(g.home,15)}<span class="val">${pct(p)}</span></div>`;}
const V=[
 ['A — today','Empty track, navy tick at the consensus, grey band for the spread of opinion. The band is real but invisible at this contrast.',A],
 ['B — filled to the probability','Bar fills from the left in the home owner’s colour; the pale notch is the spread of opinion. Scans down a column much faster than a floating tick.',B],
 ['C — diverging from 50%','Zero is the middle, because 50% is the meaningful centre. Bar leans toward the favourite and is coloured by whose team that is. Lopsided games are obvious; near-coin-flips read as short stubs.',C],
 ['D — C, anchored with logos','Same as C with the two teams as endpoints, matching how the swing column is captioned. Self-describing without the column header.',D_],
];
document.getElementById('cards').innerHTML=V.map(([t,s,fn])=>`
