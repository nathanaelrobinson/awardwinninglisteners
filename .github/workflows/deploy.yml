name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-pika

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Write .gcloudignore
        run: |
          printf '.git\n.gcloudignore\nweb/node_modules\n.venv\nvenv\n' > .gcloudignore

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy pika \
            --project snowpack-pika \
            --region us-west1 \
            --source . \
            --quiet \
            --allow-unauthenticated \
            --min-instances 1 --max-instances 1 --memory 2Gi --cpu 2 \
            --port 8080 \
            --set-env-vars "STORE=firestore,GOOGLE_CLOUD_PROJECT=snowpack-pika,SESSION_SECRET=${{ secrets.SESSION_SECRET }},REFRESH_TOKEN=${{ secrets.REFRESH_TOKEN }}"

      - name: Print service URL
        run: gcloud run services describe pika --project snowpack-pika --region us-west1 --format 'value(status.url)'
